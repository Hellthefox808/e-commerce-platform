version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxecommerce-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - JWT_SECRET=luxecommerce_production_secret_key_2026
      - CORS_ORIGIN=http://localhost:3000,http://127.0.0.1:3000,http://localhost:80
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - luxe_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: luxecommerce-frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - luxe_network

volumes:
  sqlite_data:
    driver: local

networks:
  luxe_network:
    driver: bridge
